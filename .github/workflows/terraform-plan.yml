name: Terraform CI
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init (clean)
        run: terraform init -upgrade -reconfigure
        working-directory: ./terraform

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      # NOTE: "terraform plan" is intentionally NOT run in CI for now.
      # It needs AWS credentials to query data sources (AMI, AZs), and
      # this project runs in an AWS Academy sandbox where IAM is not
      # available - so a GitHub OIDC role cannot be created, and the
      # sandbox's short-lived keys are unsuitable for GitHub Secrets.
      # When the project moves to a regular AWS account, restore the
      # plan step using aws-actions/configure-aws-credentials with an
      # OIDC-assumed role (no static secrets).
